name: Player A serving checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  serving:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r backend/serving-requirements.txt
      - run: python -m unittest backend.tests.test_player_serving backend.tests.test_db_rosters
      - run: docker build -t lck-player-a:test .
      - name: Container readiness with persistent volume
        run: |
          docker run -d --name lck-serving -p 8000:8000 -v lck-data:/data -e PREDICTION_DB_PATH=/data/predictions.sqlite3 lck-player-a:test
          for attempt in $(seq 1 20); do
            if curl --fail http://localhost:8000/ready; then exit 0; fi
            sleep 1
          done
          docker logs lck-serving
          exit 1
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
